name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format:check
      - name: Tipos
        run: npm run typecheck
      - name: Testes de lógica (Vitest)
        run: npm test
      - name: Build (modo local, sem variáveis do Supabase)
        run: npm run build
      - name: Navegador para os testes de interface
        run: npx playwright install --with-deps chromium
      - name: Testes de interface e acessibilidade (Playwright)
        run: npx playwright test
        env:
          CI: "true"
      - name: Relatório de falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
